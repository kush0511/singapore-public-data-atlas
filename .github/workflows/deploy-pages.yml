name: Deploy Singapore Data Atlas

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore dataset metadata cache
        id: metadata-cache
        uses: actions/cache/restore@v4
        with:
          path: sg_datasets_metadata.json
          key: sg-datasets-metadata-v2-${{ github.run_id }}
          restore-keys: |
            sg-datasets-metadata-v2-

      - name: Fetch latest data.gov.sg catalog and metadata
        run: node fetch_sg_datasets.js

      - name: Save dataset metadata cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sg_datasets_metadata.json
          key: sg-datasets-metadata-v2-${{ github.run_id }}

      - name: Build static explorer data
        run: node build_sg_datasets_explorer_data.js

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp index.html sg_datasets_explorer.html sg_datasets_explorer_data.js public/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
